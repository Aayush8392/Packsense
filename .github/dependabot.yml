version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Add further ecosystems only when their manifests exist (npm for the Evidence site, more pip folders).
  - package-ecosystem: "pip"
    directory: "/p1_intake"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "boto3"   # held at 1.35.99: later versions changed upload checksums and may break B2 (see buildlog)
  - package-ecosystem: "pip"
    directory: "/p4_modelling"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "boto3"   # held at 1.35.99: later versions changed upload checksums and may break B2 (see buildlog)
