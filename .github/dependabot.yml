version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The Evidence site's packages (P6). Evidence is held to its pinned release family: a major bump needs a build and a look at the pages, so group nothing and review each.
  - package-ecosystem: "npm"
    directory: "/p6_serving/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  # The public app's packages (p6_serving/app). Versions are pinned exactly and chosen at least two weeks after release; each bump is reviewed on its merits.
  - package-ecosystem: "npm"
    directory: "/p6_serving/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  # Add further ecosystems only when their manifests exist (more pip folders).
  - package-ecosystem: "pip"
    directory: "/p1_intake"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "boto3"   # held at 1.35.99: later versions changed upload checksums and may break B2 (see buildlog)
  - package-ecosystem: "pip"
    directory: "/p4_modelling"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "dbt-core"   # dbt-databricks 1.12.6 and 1.12.7 both require dbt-core below 1.12.6 (checked 2026-10-21 with uv): 1.12.6 cannot be installed with them
        versions: [">=1.12.6"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "boto3"   # held at 1.35.99: later versions changed upload checksums and may break B2 (see buildlog)
      # the two dbt packages are watched by the /p4_modelling entry above; this entry also saw them and opened a duplicate pull request for each (2026-10-16 and 2026-10-20)
      - dependency-name: "dbt-core"
      - dependency-name: "dbt-databricks"
      # ruff is a 0.x tool whose minor versions change rules: 0.8.4 to 0.17.1 gives 448 new findings on this code, so only patch releases are proposed
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
