version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14          # propose a release only once it is two weeks old, as the pins are chosen
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]     # a major version (for example TypeScript 6 to 7) comes as its own pull request, to be judged alone
  # The public app's packages (p6_serving/app). Versions are pinned exactly and chosen at least two weeks after release; each bump is reviewed on its merits.
  - package-ecosystem: "npm"
    directory: "/p6_serving/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 14
    groups:
      app-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]     # a major version (for example TypeScript 6 to 7) comes as its own pull request, to be judged alone
  # Add further ecosystems only when their manifests exist (more pip folders).
  # Python: version-update pull requests are OFF (limit 0). Dependabot edits the input files, not the hash locks, so every bump fails the lock check; the Python packages are bumped by hand
  # (move CUTOFF in tools/locks.py, `python tools/locks.py compile`). Security-advisory pull requests are a separate Dependabot feature and still open.
  - package-ecosystem: "pip"
    directory: "/p1_intake"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "boto3"   # held at 1.35.99: later versions changed upload checksums and may break B2 (see buildlog)
  - package-ecosystem: "pip"
    directory: "/p4_modelling"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "dbt-core"   # dbt-databricks 1.12.6 and 1.12.7 both require dbt-core below 1.12.6 (checked 2026-10-21 with uv): 1.12.6 cannot be installed with them
        versions: [">=1.12.6"]
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "boto3"   # held at 1.35.99: later versions changed upload checksums and may break B2 (see buildlog)
      # the two dbt packages are watched by the /p4_modelling entry above; this entry also saw them and opened a duplicate pull request for each (2026-10-16 and 2026-10-20)
      - dependency-name: "dbt-core"
      - dependency-name: "dbt-databricks"
      # ruff is a 0.x tool whose minor versions change rules: 0.8.4 to 0.17.1 gives 448 new findings on this code, so only patch releases are proposed
      - dependency-name: "ruff"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
