name: Terraform state drill (scratch key, never applies)

# P9 drill: what happens when the Terraform state of infra/terraform/github is lost or damaged?
# Everything runs against a SCRATCH state key (packsense/drill.tfstate) in the state bucket; the production state object is only read, and
# `terraform apply` is never run. See p3_delivery/bootstrap/terraform_state_drill.py for the two recoveries and how each is judged.
# Manual runs only, so the secrets are never given to a pull request.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: tfstate-aayush # a name, not a secret: useless without the key

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform/github
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_APP_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r "${GITHUB_WORKSPACE}/p1_intake/requirements.lock"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Read the keep-alive deploy key id (the id is not a secret)
        env:
          REPO: ${{ github.repository }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/keys" | jq -r '[.[] | select(.title == "keepalive")] | if length == 1 then .[0].id else empty end')
          if [ -z "$id" ]; then echo "::error::expected exactly one deploy key titled keepalive"; exit 1; fi
          echo "TF_VAR_keepalive_deploy_key_id=$id" >> "$GITHUB_ENV"
      - name: Start from an empty scratch key
        run: python "${GITHUB_WORKSPACE}/p3_delivery/bootstrap/terraform_state_drill.py" clear-scratch

      - name: "A. State lost: init on the empty scratch key"
        run: >
          terraform init -reconfigure -input=false -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=packsense/drill.tfstate"
          -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - name: "A. State lost: plan (the import blocks must rebuild it; nothing may be created)"
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color | tee "${RUNNER_TEMP}/plan_empty.txt"
      - name: "A. Judge"
        run: python "${GITHUB_WORKSPACE}/p3_delivery/bootstrap/terraform_state_drill.py" check-plan "${RUNNER_TEMP}/plan_empty.txt" --mode empty

      - name: "B. State damaged: copy an earlier version of the production state into the scratch key"
        run: python "${GITHUB_WORKSPACE}/p3_delivery/bootstrap/terraform_state_drill.py" restore-previous
      - name: "B. Init on the restored scratch key"
        run: >
          terraform init -reconfigure -input=false -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="key=packsense/drill.tfstate"
          -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - name: "B. Plan against the restored state"
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color | tee "${RUNNER_TEMP}/plan_restored.txt"
      - name: "B. Judge"
        run: python "${GITHUB_WORKSPACE}/p3_delivery/bootstrap/terraform_state_drill.py" check-plan "${RUNNER_TEMP}/plan_restored.txt" --mode restored

      - name: Remove the scratch key
        if: always()
        run: python "${GITHUB_WORKSPACE}/p3_delivery/bootstrap/terraform_state_drill.py" clear-scratch
