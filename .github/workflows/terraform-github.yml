name: Terraform (GitHub rulesets and deploy key)

on:
  pull_request:
    paths:
      - "infra/terraform/github/**"
      - ".github/workflows/terraform-github.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: tfstate-aayush # a name, not a secret: useless without the key

jobs:
  plan:
    # Secrets are never given to forks: same-repository pull requests and manual runs only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/github
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_APP_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Read the keep-alive deploy key id (the id is not a secret; the web interface does not show it)
        env:
          REPO: ${{ github.repository }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/keys" | jq -r '[.[] | select(.title == "keepalive")] | if length == 1 then .[0].id else empty end')
          if [ -z "$id" ]; then echo "::error::expected exactly one deploy key titled keepalive"; exit 1; fi
          echo "deploy key id: $id"
          echo "TF_VAR_keepalive_deploy_key_id=$id" >> "$GITHUB_ENV"
      - name: Init (state in the private B2 bucket)
        run: >
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -lock=false

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the manual approval gate.
    environment: terraform-apply
    defaults:
      run:
        working-directory: infra/terraform/github
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_APP_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Read the keep-alive deploy key id
        env:
          REPO: ${{ github.repository }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/keys" | jq -r '[.[] | select(.title == "keepalive")] | if length == 1 then .[0].id else empty end')
          if [ -z "$id" ]; then echo "::error::expected exactly one deploy key titled keepalive"; exit 1; fi
          echo "TF_VAR_keepalive_deploy_key_id=$id" >> "$GITHUB_ENV"
      - name: Init
        run: >
          terraform init -input=false -lockfile=readonly
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - name: Apply
        run: |
          set +e
          terraform apply -input=false -auto-approve 2>&1 | tee apply.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            msg=$(grep -E -A4 "Error" apply.log | head -n 24 | tr -s '[:space:]' ' ' | cut -c1-900)
            echo "::error title=terraform apply failed::$msg"
          fi
          exit "$rc"
