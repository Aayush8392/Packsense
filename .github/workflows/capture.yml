name: Daily capture (Open Food Facts delta files)

on:
  schedule:
    # 10:00 UTC (was 07:30 before 2026-10-18). This is now the SECOND path: the Databricks job captures first (06:45 UTC, capped at 07:45,
    # whole job capped at 2 h = 08:45 at the latest). GitHub's cron runs at or after its nominal time, never before, so a 10:00 slot can
    # never start while the Databricks capture is still running: no overlap, only a back-fill of whatever the first path missed.
    # (A manual dispatch can still be started at any moment: do not start one while the 06:45 job is running.)
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be captured, change nothing"
        type: boolean
        default: false
      max_files:
        description: "Capture at most N files (0 = all)"
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      B2_UPLOAD_KEY_ID: ${{ secrets.B2_UPLOAD_KEY_ID }}
      B2_UPLOAD_APPLICATION_KEY: ${{ secrets.B2_UPLOAD_APPLICATION_KEY }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_PIPELINE_TOKEN: ${{ secrets.DATABRICKS_PIPELINE_TOKEN }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r p1_intake/requirements.txt
      - name: Tell healthchecks.io the run started
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/start" || true'
      - name: Capture
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          if [[ "$MAX_FILES" =~ ^[0-9]+$ ]] && [ "$MAX_FILES" != "0" ]; then args+=(--max-files "$MAX_FILES"); fi
          python p1_intake/capture_deltas.py "${args[@]}"
      - name: Capture taxonomies
        if: ${{ !cancelled() }}  # runs even if the delta capture failed; either failure turns the run red
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python p1_intake/capture_taxonomies.py "${args[@]}"
      - name: Ping healthchecks.io (success)
        if: success() && inputs.dry_run != true
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL" || true'
      - name: Ping healthchecks.io (failure)
        if: failure()
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/fail" || true'
