name: Freshness tripwire (newest OFF delta is in landing)

on:
  schedule:
    # 11:00 UTC, 3.5 h after the capture, to allow for GitHub's best-effort cron lateness.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_PIPELINE_TOKEN: ${{ secrets.DATABRICKS_PIPELINE_TOKEN }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_FRESHNESS_PING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r p1_intake/requirements.lock
      - name: Tell healthchecks.io the run started
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/start" || true'
      - name: Check freshness
        run: python p1_intake/check_freshness.py
      - name: Ping healthchecks.io (success)
        if: success()
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL" || true'
      - name: Ping healthchecks.io (failure)
        if: failure()
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/fail" || true'
