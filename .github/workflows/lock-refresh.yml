name: Lock refresh (weekly, tooling locks only, moved onto main by itself when CI is green)

# The owner's decision (2026-11-05): the only recurring human task of the finished project is token rotation, so dependency bumps must need no click.
# Python packages are bumped by moving the cutoff in tools/locks.py and recompiling the hash locks (Dependabot does not propose them: it edits the inputs, not the locks).
# Every Monday this workflow moves the TOOLING cutoff to 14 days before today and recompiles. The tooling locks are the ones CI, the scans and the deploy tools use
# (requirements-dev, pip-audit, zizmor, uv-tool). The PRODUCTION locks (capture, gold build) have their own frozen cutoff and are never touched here: a run that changes
# one of them stops and fails.
# When a tooling lock changed it does what the owner does by hand, with no pull request (a bot's pull request would wait for a person to approve its workflow runs):
# it pushes a branch, starts CI by dispatch (a push made with the workflow's own token starts no workflows by itself, GitHub's documented rule), waits until the three checks
# that the `require-ci` rule demands (tests, lint, engines) are green on that exact commit, and only then fast-forwards main to it. If a check fails or main has moved,
# nothing is merged: the branch stays, the run summary says why, and the next run replaces it. A push made with the workflow's token starts no deploy: nothing reaches
# production from here.

on:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC, after the keep-alive (04:17) and the workflow-state check (05:00); GitHub's cron can run hours late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # push the branch, move main, delete old branches
      actions: write # start CI and the security scans on the branch
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # the version the locks are made for
      - name: Install the pinned uv
        run: pip install --no-cache-dir --require-hashes -r .github/requirements/uv-tool.lock
      - name: Move the tooling cutoff and recompile every lock
        run: |
          python tools/locks.py bump
          python tools/locks.py compile
      - name: Production locks must not have moved
        run: |
          if ! git diff --quiet -- p1_intake/requirements.lock p4_modelling/requirements.lock; then
            echo "A production lock changed. They are frozen by decision (PRODUCTION_CUTOFF in tools/locks.py); stopping." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Stop when no tooling lock changed
        id: changed
        run: |
          if git diff --quiet -- requirements-dev.lock '.github/requirements/*.lock'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tooling lock changed: nothing newer than the two-week cutoff." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push a branch, wait for the required checks, move main
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -u
          BRANCH="lock-refresh-$(date -u +%F)"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git diff -U0 -- requirements-dev.lock '.github/requirements/*.lock' | grep -E '^[+-][A-Za-z0-9_.-]+==' | grep -vE '^(\+\+\+|---)' | cut -c1-120 | head -150 > /tmp/moved.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tools/locks.py requirements-dev.lock .github/requirements/*.lock
          git commit -q -m "Refresh the tooling hash locks (cutoff moved forward)"
          SHA="$(git rev-parse HEAD)"
          git push --force "$URL" "HEAD:refs/heads/${BRANCH}"
          # older refresh branches are replaced, not stacked
          for ref in $(gh api "repos/${REPO}/git/matching-refs/heads/lock-refresh-" --jq '.[].ref'); do
            if [ "$ref" != "refs/heads/${BRANCH}" ]; then gh api -X DELETE "repos/${REPO}/git/${ref}" || true; fi
          done
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run security.yml --repo "$REPO" --ref "$BRANCH"
          {
            echo "Branch ${BRANCH} at ${SHA}. CI and the security scans were started on it by dispatch."
            echo
            echo "Packages that moved (- old, + new; the first 150 lines):"
            echo '```'
            cat /tmp/moved.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          RESULT="timeout"
          for i in $(seq 1 40); do
            sleep 15
            ok="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name=="tests" or .name=="lint" or .name=="engines") | select(.status=="completed" and .conclusion=="success")] | length')"
            bad="$(gh api "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name=="tests" or .name=="lint" or .name=="engines") | select(.status=="completed" and .conclusion!="success")] | length')"
            if [ "$bad" != "0" ]; then RESULT="failed"; break; fi
            if [ "$ok" = "3" ]; then RESULT="green"; break; fi
          done
          if [ "$RESULT" != "green" ]; then
            echo "Not moved onto main: the required checks were not green (${RESULT}). The branch stays; the next run replaces it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The first proof run (2026-11-05) was refused with "3 of 3 required status checks are expected" although the checks API already showed them green: the rule
          # may lag the API, so the push is retried after a pause. Each attempt is written to the summary.
          sleep 45
          MOVED="no"
          for attempt in 1 2 3 4; do
            if git push "$URL" "${SHA}:refs/heads/main" 2> /tmp/push_err.txt; then
              echo "main was fast-forwarded to ${SHA} (attempt ${attempt}). No deploy follows." >> "$GITHUB_STEP_SUMMARY"
              MOVED="yes"
              break
            fi
            echo "Attempt ${attempt} refused: $(grep -m1 -E 'required status|rule violations|non-fast-forward|rejected' /tmp/push_err.txt | cut -c1-200)" >> "$GITHUB_STEP_SUMMARY"
            sleep 60
          done
          if [ "$MOVED" != "yes" ]; then
            echo "main was NOT moved: the push was refused 4 times (main moved on, or a rule refused it). The branch stays; the next run replaces it." >> "$GITHUB_STEP_SUMMARY"
          fi
