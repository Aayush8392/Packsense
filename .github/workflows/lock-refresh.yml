name: Lock refresh (weekly, tooling locks only, merged by itself when CI is green)

# The owner's decision (2026-11-05): the only recurring human task of the finished project is token rotation, so dependency bumps must need no click.
# Python packages are bumped by moving the cutoff in tools/locks.py and recompiling the hash locks (Dependabot does not propose them: it edits the inputs, not the locks).
# Every Monday this workflow moves the TOOLING cutoff to 14 days before today and recompiles. The tooling locks are the ones CI, the scans and the deploy tools use
# (requirements-dev, pip-audit, zizmor, uv-tool). The PRODUCTION locks (capture, gold build) have their own frozen cutoff and are never touched here: a run that changes
# one of them stops and fails. When a tooling lock changed, it pushes a branch, closes older refresh pull requests, starts CI and the security scans on the branch by
# dispatch (a push made with the workflow's own token starts no workflows by itself, GitHub's documented rule), opens ONE pull request and turns on auto-merge.
# GitHub merges it only when the required checks (tests, lint) pass on the branch commit; if they fail, the pull request just stays open and the next run replaces it.
# A merge made with the workflow's token starts no deploy: nothing reaches production from here.
# Needs the repository settings "Allow GitHub Actions to create and approve pull requests" and "Allow auto-merge". If either is off, the run summary says what was skipped.

on:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC, after the keep-alive (04:17) and the workflow-state check (05:00); GitHub's cron can run hours late
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the branch, delete a closed branch
      pull-requests: write # open, close and auto-merge the pull request
      actions: write # start CI and the security scans on the branch
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # the version the locks are made for
      - name: Install the pinned uv
        run: pip install --no-cache-dir --require-hashes -r .github/requirements/uv-tool.lock
      - name: Move the tooling cutoff and recompile every lock
        run: |
          python tools/locks.py bump
          python tools/locks.py compile
      - name: Production locks must not have moved
        run: |
          if ! git diff --quiet -- p1_intake/requirements.lock p4_modelling/requirements.lock; then
            echo "A production lock changed. They are frozen by decision (PRODUCTION_CUTOFF in tools/locks.py); stopping." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Stop when no tooling lock changed
        id: changed
        run: |
          if git diff --quiet -- requirements-dev.lock '.github/requirements/*.lock'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No tooling lock changed: nothing newer than the two-week cutoff." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push a branch, start the checks, open the pull request, turn on auto-merge
        if: steps.changed.outputs.changed == 'true'
        run: |
          set -u
          BRANCH="lock-refresh-$(date -u +%F)"
          git diff -U0 -- requirements-dev.lock '.github/requirements/*.lock' | grep -E '^[+-][A-Za-z0-9_.-]+==' | grep -vE '^(\+\+\+|---)' | cut -c1-120 | head -150 > /tmp/moved.txt || true
          {
            echo "Weekly refresh of the tooling hash locks: cutoff moved to 14 days before the run. The production locks are frozen and untouched."
            echo
            echo "Packages that moved (- old, + new; the first 150 lines):"
            echo '```'
            cat /tmp/moved.txt
            echo '```'
            echo
            echo "Auto-merge is on: GitHub merges this when the required checks pass on the branch commit. No deploy follows from the merge."
          } > /tmp/body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tools/locks.py requirements-dev.lock .github/requirements/*.lock
          git commit -q -m "Refresh the tooling hash locks (cutoff moved forward)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"
          # older refresh pull requests are replaced, not stacked
          for n in $(gh pr list --repo "$REPO" --state open --json number,headRefName --jq ".[] | select(.headRefName | startswith(\"lock-refresh-\")) | select(.headRefName != \"${BRANCH}\") | .number"); do
            gh pr close "$n" --repo "$REPO" --delete-branch --comment "Replaced by the refresh of $(date -u +%F)." || true
          done
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          gh workflow run security.yml --repo "$REPO" --ref "$BRANCH"
          echo "CI and the security scans were started on ${BRANCH} by dispatch." >> "$GITHUB_STEP_SUMMARY"
          if gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "Refresh the tooling hash locks ($(date -u +%F))" --body-file /tmp/body.md; then
            echo "Pull request opened from ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
            if gh pr merge "$BRANCH" --repo "$REPO" --auto --squash; then
              echo "Auto-merge is on." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Auto-merge could not be turned on (check the setting 'Allow auto-merge'); the pull request stays open." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "The branch ${BRANCH} was pushed, but the pull request could not be opened (check the setting 'Allow GitHub Actions to create and approve pull requests')." >> "$GITHUB_STEP_SUMMARY"
          fi
