name: Delete-marker tripwire (has anything hidden an object in B2?)

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      self_test:
        description: "Deliberate-failure self-test: create a real delete marker under tmp/ and run the check with the tmp/ allowance off. The run is EXPECTED to fail and raise the alert."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delete-markers
  cancel-in-progress: false

jobs:
  delete-markers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
      B2_READ_APPLICATION_KEY: ${{ secrets.B2_READ_APPLICATION_KEY }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_MARKERS_PING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r p1_intake/requirements.lock
      - name: Tell healthchecks.io the run started
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/start" || true'
      - name: Check for delete markers
        if: ${{ !inputs.self_test }}
        run: python p1_intake/check_delete_markers.py
      - name: Self-test (expected to fail)
        if: ${{ inputs.self_test }}
        env:
          B2_UPLOAD_KEY_ID: ${{ secrets.B2_UPLOAD_KEY_ID }}
          B2_UPLOAD_APPLICATION_KEY: ${{ secrets.B2_UPLOAD_APPLICATION_KEY }}
          ALLOW_TMP_MARKERS: "false"
        run: python p1_intake/check_delete_markers.py --make-test-marker
      - name: Ping healthchecks.io (success)
        if: success()
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL" || true'
      - name: Ping healthchecks.io (failure)
        if: failure()
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/fail" || true'
