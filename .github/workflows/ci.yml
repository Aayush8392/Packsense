name: CI (tests and lint)

on:
  pull_request:
  push:
    # every branch, not only main: with CI required on main, a commit must already have its result when main moves to it
    branches: ["**"]
  workflow_dispatch:

# Read-only token, and no secrets anywhere in this workflow: it must run safely on pull requests from forks and from Dependabot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # the version the capture workflow runs on
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Unit tests (real sanitised records only, no network, no Databricks)
        run: python -m pytest p1_intake/tests p2_lakehouse/tests p4_modelling/tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir -r requirements-dev.txt
      - name: Lint (ruff; settings in ruff.toml)
        run: python -m ruff check .
