name: CI (tests and lint)

on:
  pull_request:
  push:
    # every branch, not only main: with CI required on main, a commit must already have its result when main moves to it
    branches: ["**"]
  workflow_dispatch:

# Read-only token, and no secrets anywhere in this workflow: it must run safely on pull requests from forks and from Dependabot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # the version the capture workflow runs on
      - run: pip install --no-cache-dir --require-hashes -r requirements-dev.lock
      - name: Unit tests (real sanitised records only, no network, no Databricks)
        run: python -m pytest p1_intake/tests p2_lakehouse/tests p3_delivery/tests p4_modelling/tests p5_governance/tests p6_serving/tests p7_triage_ml/tests p8_steward/tests p9_operations/tests tools/tests -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r requirements-dev.lock
      - name: Lint (ruff; settings in ruff.toml)
        run: python -m ruff check .
      - name: Lock files match their requirements inputs (tools/locks.py)
        run: |
          pip install --no-cache-dir --require-hashes -r .github/requirements/uv-tool.lock
          python tools/locks.py check

  # Slim CI for the gold models (design 6.6): the portable models must give the same rows on DuckDB as the Databricks run recorded in
  # p4_modelling/fixtures/golden.json, and both Databricks projects (normal and fixture mode) must still parse. No secrets, no warehouse:
  # the three variables below are dummies that only let the profile render.
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r p4_modelling/requirements.lock
      - name: Parse the Databricks project (no connection)
        working-directory: p4_modelling
        env:
          DATABRICKS_HOST: https://example.invalid
          DBT_HTTP_PATH: /sql/1.0/warehouses/none
          DATABRICKS_TOKEN: not-a-real-token
        run: |
          dbt parse --target dev_admin --profiles-dir .
          dbt parse --target fixture_admin --vars '{fixture_mode: true}' --profiles-dir .
      - name: Build the portable models on DuckDB (fixture, 52 nodes including the dbt tests)
        working-directory: p4_modelling
        run: |
          python -m gold_lib.fixture_load --db target/fixture.duckdb
          dbt build --target duckdb --profiles-dir .
      - name: The SQL rule verdicts agree with rules_lib.py (real sets and one-field variants)
        run: python -m pytest p4_modelling/tests/test_rule_verdicts_agree.py -q
      - name: Compare with the Databricks run (golden)
        working-directory: p4_modelling
        run: python bootstrap/compare_engines.py check --duckdb target/fixture.duckdb
      - name: Gold columns equal the committed list behind DATA_CLASSIFICATION.md
        run: python p5_governance/bootstrap/gold_columns.py check --duckdb p4_modelling/target/fixture.duckdb
      - name: Rerun idempotence (second build, full refresh, reverse-order load)
        working-directory: p4_modelling
        run: python bootstrap/compare_engines.py idempotence --duckdb target/fixture.duckdb

  # The public app (p6_serving/app, slice 1 on): types, lint, tests (including the accessibility and contrast checks) and a production build
  # from the lockfile, with install scripts off. Not a required check yet; it joins the ruleset when the app replaces Evidence.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: p6_serving/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p6_serving/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
