name: Terraform (B2 bucket and repository secrets)

# Manual only. This is the one workflow that needs the temporary B2 admin key (B2_TF_KEY_ID and B2_TF_APP_KEY): make the key, add the
# two secrets, run, then delete the secrets and the key. The GitHub rulesets and the deploy key are in terraform-github.yml.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan or apply"
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: tfstate-aayush # a name, not a secret: useless without the key

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/b2
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_APP_KEY }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_TF_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_TF_APP_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Check secret shapes (lengths only, values are never printed)
        env:
          S1: ${{ secrets.TF_STATE_KEY_ID }}
          S2: ${{ secrets.TF_STATE_APP_KEY }}
          S3: ${{ secrets.B2_TF_KEY_ID }}
          S4: ${{ secrets.B2_TF_APP_KEY }}
          S5: ${{ secrets.GH_TF_TOKEN }}
        run: |
          show() { v="${!2}"; t="$(printf '%s' "$v" | tr -d '[:space:]')"; echo "$1: length=${#v}, whitespace=$([ "${#v}" != "${#t}" ] && echo YES || echo no)"; }
          show TF_STATE_KEY_ID S1; show TF_STATE_APP_KEY S2; show B2_TF_KEY_ID S3; show B2_TF_APP_KEY S4; show GH_TF_TOKEN S5
          echo "Backblaze key ids are 25 characters and application keys 31; a missing secret shows length=0."
      - name: Init (state in the private B2 bucket)
        run: >
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -lock=false

  apply:
    needs: plan
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the manual approval gate.
    environment: terraform-apply
    defaults:
      run:
        working-directory: infra/terraform/b2
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_APP_KEY }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_TF_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_TF_APP_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - name: Apply
        run: |
          set +e
          terraform apply -input=false -auto-approve 2>&1 | tee apply.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            msg=$(grep -E -A4 "Error" apply.log | head -n 24 | tr -s '[:space:]' ' ' | cut -c1-900)
            echo "::error title=terraform apply failed::$msg"
          fi
          exit "$rc"
