name: Security scans (secrets, workflows, dependencies)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: a new advisory can hit a dependency that did not change.
    - cron: "41 5 * * 3"
  workflow_dispatch:

# Read-only token and no secrets: safe on pull requests from forks and from Dependabot.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Scans the full git history for committed secrets (GitHub push protection only covers new pushes).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  zizmor:
    # Static analysis of the workflow files themselves (injection, over-broad permissions, unpinned actions, credential persistence).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir zizmor==1.30.1
      - name: Audit workflows (offline audits only, no token needed)
        run: zizmor --no-online-audits .github/workflows

  pip-audit:
    # Known vulnerabilities in the pinned dependencies (PyPI advisory data).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir pip-audit==2.10.1
      - name: Audit the pinned requirements (versions are pinned in the files; no resolution needed)
        run: pip-audit -r requirements-dev.txt --no-deps --disable-pip
