name: Security scans (secrets, workflows, dependencies)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: a new advisory can hit a dependency that did not change.
    - cron: "41 5 * * 3"
  workflow_dispatch:

# Read-only token and no secrets: safe on pull requests from forks and from Dependabot.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Scans the full git history for committed secrets (GitHub push protection only covers new pushes).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The action's own default is 8.24.3, which ignores the [[allowlists]] syntax of .gitleaks.toml (needs 8.25+).
          GITLEAKS_VERSION: "8.30.1"

  zizmor:
    # Static analysis of the workflow files themselves (injection, over-broad permissions, unpinned actions, credential persistence).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r .github/requirements/zizmor.lock
      - name: Audit workflows (offline audits only, no token needed)
        run: zizmor --no-online-audits .github/workflows

  pip-audit:
    # Known vulnerabilities in the pinned dependencies (PyPI advisory data).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir --require-hashes -r .github/requirements/pip-audit.lock
      - name: Audit the hash-locked requirements, transitive packages included (every version is pinned in the locks; no resolution needed)
        run: |
          pip-audit -r requirements-dev.lock --no-deps --disable-pip --require-hashes
          pip-audit -r p1_intake/requirements.lock --no-deps --disable-pip --require-hashes
          # PYSEC-2026-4114 and CVE-2026-49272 (both oauthlib 3.3.1) are accepted on purpose: dbt-databricks 1.12.6 caps its connector at a version that needs oauthlib < 4, and
          # both flaws are in server-side code (the PKCE check, the device-code token endpoint), which a client does not run. The reasoning and the point to revisit are in tools/locks.py.
          pip-audit -r p4_modelling/requirements.lock --no-deps --disable-pip --require-hashes --ignore-vuln PYSEC-2026-4114 --ignore-vuln CVE-2026-49272
