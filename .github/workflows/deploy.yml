name: Deploy (Asset Bundle)

# Deploys the Databricks jobs from the bundle in databricks.yml: dev first, then prod after a manual approval.
# Runs only for commits already on `main` (which requires CI) or when started by hand; never for pull requests.
# Each environment holds its own principal's client id and secret (environment secrets), so the prod secret is only
# available to the prod job, and that job waits for the reviewer set on the `prod` environment.
on:
  push:
    branches: [main]
    paths:
      # what changes the deployed bundle: not the tests, the bootstrap scripts or the READMEs (the bundle's sync leaves out the first two,
      # and a README edit changes nothing the jobs run). The negative patterns apply to the positive ones above them.
      - databricks.yml
      - p1_intake/**
      - p2_lakehouse/**
      - p3_delivery/**
      - '!**/tests/**'
      - '!**/bootstrap/**'
      - '!**/README.md'
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev:
    name: deploy dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9 # v1.21.0
        with:
          version: 1.19.0
      - run: databricks bundle validate -t dev
      - run: databricks bundle deploy -t dev

  prod:
    name: deploy prod
    needs: dev
    runs-on: ubuntu-latest
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: databricks/setup-cli@2bf4520fd10723ed5a22eca62a8c8a63714a7ba9 # v1.21.0
        with:
          version: 1.19.0
      - run: databricks bundle validate -t prod
      - run: databricks bundle deploy -t prod
