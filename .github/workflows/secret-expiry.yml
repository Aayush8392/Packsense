name: Secret expiry tripwire (any credential within N days of expiring)

on:
  schedule:
    # 08:00 UTC daily. GitHub's cron can run hours late; for a warning that counts in days that does not matter.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      threshold_days:
        description: "Alarm when a secret has this many days left or fewer (default 10). A larger value proves the alarm path."
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: secret-expiry
  cancel-in-progress: false

jobs:
  secret-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The list lives in a repository variable (the repo is public; Actions logs are too: the script prints counts only).
      SECRET_EXPIRY_LIST: ${{ vars.SECRET_EXPIRY_LIST }}
      SECRET_EXPIRY_THRESHOLD_DAYS: ${{ inputs.threshold_days }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_SECRETS_PING_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check secret expiry
        run: python p1_intake/check_secret_expiry.py
      - name: Ping healthchecks.io (the script crashed before it could ping)
        if: failure()
        run: '[ -n "$HEALTHCHECKS_PING_URL" ] && curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_PING_URL/fail" || true'
