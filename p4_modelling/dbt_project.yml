name: packsense
version: "0.1.0"
config-version: 2
profile: packsense_gold

model-paths: ["models"]
test-paths: ["data_tests"]      # the Python tests live in tests/ and run with pytest, not with dbt
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  silver_schema: packsense_dev_silver    # prod overrides this with --vars when the prod gold job exists
  gold_taxonomies: [countries, data_quality, labels]   # the taxonomies gold takes the newest snapshot of (taxonomy_tag_latest)
  fixture_mode: false                    # true only in the throwaway verification schema (target fixture_admin), see models/fixture_sources.yml

models:
  packsense:
    # Same model names live in databricks/ and duckdb/ (the staging views): exactly one folder is enabled per engine.
    databricks:
      +materialized: view
      +enabled: "{{ target.type == 'databricks' }}"
    duckdb:
      +materialized: view
      +enabled: "{{ target.type == 'duckdb' }}"
    portable:
      +materialized: table
