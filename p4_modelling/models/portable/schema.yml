version: 2

models:
  - name: product_history
    description: >
      SCD2 history of every product, one row per period, derived from silver's version history and rebuilt in full every run.
      A new period opens only when the tracked set changes (see macros/tracked.sql); versions that change nothing are merged.
      The open row is is_latest_observed (never "current": OFF publishes no deletions).
    columns:
      - name: history_key
        description: Deterministic hash of (code, valid_from_t), so a rebuild reproduces the same keys.
        data_tests: [unique, not_null]
      - name: code
        data_tests: [not_null]
      - name: valid_from_t
        description: Unix seconds of the version that opened the period (OFF's last_modified_t).
        data_tests: [not_null]
      - name: valid_to_t
        description: Unix seconds of the next period's first version; NULL on the open row.
      - name: versions_merged
        description: How many silver versions the period covers (1 plus the no-op versions merged into it).
        data_tests: [not_null]
      - name: unseen_edits
        description: Edits OFF counted (rev) between our versions in this period that we never observed.
      - name: is_latest_observed
        description: 1 on the newest period of a code, else 0.
        data_tests: [not_null]

  - name: product_flag_spans
    description: >
      OFF's quality flags as spans: one row per product, flag and unbroken run of versions that carry it (a flag that vanishes and
      returns is two spans). Separate from the history table. The flag is the raw OFF tag; mapping to check families waits for the
      taxonomy loader.
    columns:
      - name: flag_id
        description: Hash of (code, severity, flag, first_seen_t); a rebuild reproduces the same ids.
        data_tests: [unique, not_null]
      - name: severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['error', 'warning', 'info', 'bug']
      - name: first_seen_is_first_version
        description: 1 when the product was never observed without the flag, so its appearance time is not known.
        data_tests: [not_null]
      - name: is_open
        description: 1 when the product's newest observed version still carries the flag.
        data_tests: [not_null]
      - name: vanished_with_tracked_change
        description: 1 when the version that dropped the flag also changed the tracked set; NULL while the span is open.

  - name: dim_brand
    description: One row per distinct first brand (free text, trimmed, lower-cased); spelling variants stay separate.
    columns:
      - name: brand_key
        data_tests: [unique, not_null]
      - name: brand_name
        data_tests: [unique, not_null]

  - name: bridge_product_market
    description: One row per history period and country tag.
    columns:
      - name: history_key
        data_tests: [not_null]
      - name: market_code
        data_tests: [not_null]

  - name: dim_market
    description: >
      One row per country tag seen in the history. India has the seed plus all daily deltas; other markets only the daily deltas,
      so non-India coverage is partial and must not back a global-catalogue claim.
    columns:
      - name: market_code
        data_tests: [unique, not_null]
      - name: is_target_market
        data_tests: [not_null]
      - name: market_name
        description: English name from OFF's countries taxonomy (newest snapshot), else the tag itself.
        data_tests: [not_null]
      - name: country_code_2
        description: OFF's two-letter code from the countries taxonomy (mostly ISO 3166-1 alpha-2; OFF uses UK for the United Kingdom, ISO says GB); NULL when the taxonomy has none.
      - name: taxonomy_matched
        description: 1 when the tag IS a canonical tag of the countries taxonomy (exact match only).
        data_tests: [not_null]
      - name: match_type
        description: "tag (canonical), name (the text equals one country's name in some language, ignoring case), ambiguous (a name shared by several countries, nothing chosen) or none."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tag', 'name', 'ambiguous', 'none']
      - name: canonical_tag
        description: The countries taxonomy tag this tag resolves to; set exactly for match_type tag or name.

  - name: dim_flag
    description: >
      One row per distinct quality flag in the flag spans, with its family from OFF's data_quality taxonomy. A flag the taxonomy does not
      list (OFF generates many in code, such as the per-source nutrition checks) is 'unmapped' and gets no family: nothing is guessed.
    columns:
      - name: flag
        data_tests: [unique, not_null]
      - name: family_source
        description: taxonomy (has a parent), root (top-level tag) or unmapped (not in the taxonomy).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['taxonomy', 'root', 'unmapped']
      - name: in_taxonomy
        data_tests: [not_null]
      - name: n_severities
        description: How many severities the flag appears under in the spans. A flag is not one severity (OFF files the same tag under different severities).
        data_tests: [not_null]

  - name: taxonomy_tag_latest
    description: The newest snapshot of each taxonomy gold uses (var gold_taxonomies), one row per tag.
    columns:
      - name: tag
        data_tests: [not_null]

  - name: dim_date
    description: Calendar from 2012-01-01 to 2035-12-31 (weekday added later through a per-engine macro).
    columns:
      - name: date_key
        description: yyyymmdd as an integer.
        data_tests: [unique, not_null]
      - name: calendar_date
        data_tests: [unique, not_null]

  - name: product_status
    description: >
      Whether each product we hold is still in OFF's food database, from its latest existence check (silver_existence_check: the weekly snapshot comparison and the
      Airflow lookups of OFF's API). One row per product; a product with no check yet is `unverified`. Rebuilt in full every night.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: status
        description: unverified, present_in_snapshot, confirmed_exists, confirmed_not_found (OFF's API has no such product), moved_other_type (OFF moved it to another product type), invalid_code, unconfirmed (the API gave no clear answer).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unverified', 'present_in_snapshot', 'confirmed_exists', 'confirmed_not_found', 'moved_other_type', 'invalid_code', 'unconfirmed']
      - name: detail
        description: What OFF said beyond the status, for example `beauty` for a product moved to Open Beauty Facts. NULL otherwise.
      - name: checked_at
        description: When the latest check was made (the snapshot's commit time for a snapshot row). NULL while unverified.
      - name: evidence_source
        description: snapshot or off_api_v2. NULL while unverified.

  - name: product_nutrition_sets
    description: >
      The per-source nutrition of each product's latest version: one row per input set (source, preparation, basis). OFF checks each set separately (estimates
      excluded); silver's aggregated nutrient columns mix sets. Current version only, rebuilt in full every night. A product without input sets has no rows.
    columns:
      - name: code
        data_tests: [not_null]
      - name: last_modified_t
        data_tests: [not_null]
      - name: source
        description: packaging, manufacturer or estimate (OFF's own estimate).
        data_tests: [not_null]
      - name: preparation
        description: as_sold or prepared.
      - name: per
        description: The basis the values are given for, e.g. 100g, 100ml or serving. The rules compare 100g and 100ml only.
      - name: per_quantity
      - name: per_unit
      - name: is_estimate
        description: True for OFF's own estimate; OFF leaves these out of its arithmetic checks.
        data_tests: [not_null]
      - name: energy_kj
        description: kJ; from `energy-kj`, else OFF's older `energy` key.
      - name: energy_kcal
      - name: fat
        description: Grams per the set's basis, like every nutrient column below.
      - name: saturated_fat
      - name: carbohydrates
      - name: sugars
      - name: starch
      - name: fiber
      - name: proteins
      - name: salt
      - name: sodium

  - name: bridge_product_allergen
    description: >
      Which allergens a history period declares: one row per period, allergen tag and relationship (contains = allergens_tags,
      may_contain = traces_tags).
    columns:
      - name: history_key
        data_tests: [not_null]
      - name: relationship
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['contains', 'may_contain']
      - name: allergen_tag
        data_tests: [not_null]

  - name: bridge_product_category
    description: >
      Which categories a history period carries: one row per period and category tag (raw, user-entered). OFF's list already holds the
      ancestors of each category, so no closure table is needed.
    columns:
      - name: history_key
        data_tests: [not_null]
      - name: category_tag
        data_tests: [not_null]

  - name: bridge_product_label
    description: Which labels (organic, vegan, fair trade, ...) a history period carries, one row per period and label tag (raw, user-entered).
    columns:
      - name: history_key
        data_tests: [not_null]
      - name: label_tag
        data_tests: [not_null]

  - name: dim_category
    description: >
      One row per category tag seen in the history, resolved against OFF's categories taxonomy (tag, name, ambiguous, none) with the hierarchy
      (parents, n_children, is_root) from the taxonomy.
    columns:
      - name: category_tag
        data_tests: [unique, not_null]
      - name: match_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tag', 'name', 'ambiguous', 'none']
      - name: canonical_tag
        description: The categories taxonomy tag this tag resolves to; set exactly for match_type tag or name.

  - name: dim_label
    description: One row per label tag seen in the history, resolved against OFF's labels taxonomy (tag, name, ambiguous, none).
    columns:
      - name: label_tag
        data_tests: [unique, not_null]
      - name: match_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tag', 'name', 'ambiguous', 'none']
      - name: canonical_tag
        description: The labels taxonomy tag this tag resolves to; set exactly for match_type tag or name.

  - name: dim_allergen
    description: >
      One row per allergen tag seen in the history, named from OFF's allergens taxonomy. The tags are user-entered, so some are not in the
      taxonomy: they keep the tag as their name and taxonomy_matched = 0.
    columns:
      - name: allergen_tag
        data_tests: [unique, not_null]
      - name: taxonomy_matched
        description: 1 when the tag IS a canonical tag of the allergens taxonomy (exact match only).
        data_tests: [not_null]
      - name: match_type
        description: "tag (canonical), name (the text equals one allergen's name in some language, ignoring case: en:Milch, fr:Avoine), ambiguous (a name shared by several allergens, nothing chosen) or none."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tag', 'name', 'ambiguous', 'none']
      - name: canonical_tag
        description: The allergens taxonomy tag this tag resolves to; set exactly for match_type tag or name.

  - name: taxonomy_name_lookup
    description: >
      Which taxonomy tag a written name belongs to, across all languages of the taxonomy, lower-cased. n_tags is how many tags carry the name;
      when it is not 1 the name is ambiguous.
    columns:
      - name: name_key
        data_tests: [not_null]
      - name: n_tags
        data_tests: [not_null]

  - name: mart_allergen_change_log
    description: >
      The allergen change log for food safety: for every product and every pair of consecutive history periods, the allergen tags that were
      added or removed, per relationship. A product's first period is its starting state and gives no rows.
    columns:
      - name: change_key
        description: Hash of (code, changed_at_t, relationship, allergen_tag, change_type); a rebuild reproduces the same keys.
        data_tests: [unique, not_null]
      - name: change_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['added', 'removed']
      - name: canonical_allergen_tag
        description: The recognised allergen the tag resolves to (see dim_allergen); NULL for ambiguous or unknown free text. Group on this.
      - name: allergen_match_type
        description: How the tag was resolved (tag, name, ambiguous, none); filter on tag and name for recognised allergens.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['tag', 'name', 'ambiguous', 'none']
      - name: relationship
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['contains', 'may_contain']

  - name: fct_product_change_daily
    description: >
      Daily change fact: one row per UTC edit day, scope (all markets or India), change group and seed flag. Group rows overlap (one edit can
      change several groups), so use change_group 'any' for a total. A product's first period is a change of nothing and appears only as
      'new_product' when OFF's revision counter says 1 and the version did not come from the seed. unseen_edits makes counts a lower bound.
    columns:
      - name: fact_key
        description: Hash of (change_date, scope, change_group, opened_by_seed); a rebuild reproduces the same keys.
        data_tests: [unique, not_null]
      - name: date_key
        description: Key into dim_date (null would mean an edit day outside 2012 to 2035).
        data_tests: [not_null]
      - name: scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all', 'india']
      - name: change_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['any', 'new_product', 'name_brand', 'quantity', 'nutrition', 'nutriscore_nova', 'ingredients', 'allergens', 'categories_labels', 'other_tags']
      - name: opened_by_seed
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fct_catalogue_quality_daily
    description: >
      Daily snapshot of OFF quality flags over the products we hold: one row per UTC day, scope (all or india), severity and flag family.
      open_spans counts spans, not products. carried_in are spans on a product's first observed version (not a real appearance). The first
      day shown starts from the stock carried in by the seed. This is the quality of what we hold, not of OFF.
    columns:
      - name: fact_key
        description: Hash of (snapshot_date, scope, severity, flag_family); a rebuild reproduces the same keys.
        data_tests: [unique, not_null]
      - name: date_key
        data_tests: [not_null]
      - name: scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all', 'india']
      - name: severity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['error', 'warning', 'info', 'bug']
      - name: flag_family
        data_tests: [not_null]
      - name: open_spans
        data_tests: [not_null]
      - name: n_products_held
        data_tests: [not_null]

  - name: mart_brand_scorecard
    description: >
      Brand scorecard: one row per scope (all or india) and brand, over the products we hold as they stood at the end of the newest complete day
      (as_of_date). Counts of products with each field filled, open flag spans and an is_ranked flag (30 or more products). A snapshot rebuilt in
      full each night. It describes what we hold, not the brand's catalogue.
    columns:
      - name: scorecard_key
        description: Hash of (scope, first brand); a rebuild reproduces the same keys.
        data_tests: [unique, not_null]
      - name: scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['all', 'india']
      - name: brand_name
        data_tests: [not_null]
      - name: as_of_date
        data_tests: [not_null]
      - name: n_products
        data_tests: [not_null]
      - name: is_ranked
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: mart_india_release
    description: >
      India release mart: one row per India product as last observed (latest period lists the canonical India tag), without the products OFF said are gone
      (confirmed_not_found, moved_other_type). Input of the monthly India release; nothing is published from this table directly (the release job runs the
      exit function and the licence gate). No image, no ingredient text, no hashed column, no editor count.
    columns:
      - name: code
        data_tests: [unique, not_null]
      - name: existence_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unverified', 'present_in_snapshot', 'confirmed_exists', 'invalid_code', 'unconfirmed']
      - name: last_modified_t
        data_tests: [not_null]
      - name: open_error_flags
        data_tests: [not_null]
