# The gold job `packsense-gold-build`: dbt build (all models, then their tests) as the gold principal that deployed it.
# Serverless with the pinned dbt packages in an environment (the same mechanism the C16 dbt test proved).
resources:
  jobs:
    gold_build:
      name: packsense-gold-build
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: ${var.gold_cron}
        timezone_id: UTC
        pause_status: UNPAUSED
      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-core==1.12.5
              - dbt-databricks==1.12.6
      tasks:
        - task_key: build
          environment_key: dbt_env
          notebook_task:
            notebook_path: ../notebooks/gold_run.py
            base_parameters:
              run_id: "{{job.run_id}}"
              dbt_target: ${var.dbt_target}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              http_path: ${var.http_path}
              ping_healthchecks: ${var.ping}
