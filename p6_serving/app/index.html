<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>PackSense</title>
    <script>
      // Apply a theme the visitor chose before the page paints, so it does not flash the other one first.
      try {
        var chosen = localStorage.getItem('packsense-theme');
        if (chosen === 'light' || chosen === 'dark') document.documentElement.dataset.theme = chosen;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
