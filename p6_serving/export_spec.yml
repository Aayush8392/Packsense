# The public export contract (P6, B0): exactly which gold tables and columns may reach the public site, and under which rules.
# Everything here is PUBLIC-class (DATA_CLASSIFICATION.md): aggregates only, no product-grain row, no contributor code, no image.
# export_lib.py reads this file; a column that is not listed cannot be exported, and a test fails when a listed column is classified
# personal or internal. Changing this file is a change to what the world can see: it goes through a pull request like any code.
version: 1
source_name: Open Food Facts
licence: ODbL-1.0
attribution: >-
  Contains data from Open Food Facts (https://openfoodfacts.org), available under the Open Database License
  (https://opendatacommons.org/licenses/odbl/1-0/). This site describes our own copy of the data at the stated build time,
  not Open Food Facts itself.
# A count of 1 to 4 is blanked (and counted in `suppressed_cells`) in every listed count column: small cells identify too much.
# Limit, stated on the site: a blanked cell can sometimes be recovered from a total beside it; this is not formal disclosure control.
suppress_below: 5

datasets:
  brand_scorecard:
    table: mart_brand_scorecard
    where: "is_ranked = 1"          # a named brand with at least 30 products; the floor is the dbt var scorecard_min_products
    columns: [scope, brand_name, as_of_date, n_products, n_with_nutrition, n_with_nutriscore, n_with_nova, n_with_quantity,
              n_with_ingredients, n_with_categories, n_with_labels, coverage_points,
              n_filled_0, n_filled_1, n_filled_2, n_filled_3, n_filled_4, n_filled_5, n_filled_6, n_filled_7]
    # Deliberately NOT exported: open_error_spans, open_warning_spans, n_products_with_error_flag (no per-brand error counts in public).
    text_columns: [brand_name]      # passed through the exit function
    count_columns: []               # every row has at least 30 products
    order_by: [scope, brand_name]
  quality_daily:
    table: fct_catalogue_quality_daily
    columns: [snapshot_date, scope, severity, flag_family, open_spans, opened_on_known_product, carried_in, vanished, n_products_held]
    text_columns: [flag_family]     # a taxonomy tag such as en:nutrition-value-total-over-105
    count_columns: [open_spans, opened_on_known_product, carried_in, vanished]
    order_by: [snapshot_date, scope, severity, flag_family]
  change_daily:
    table: fct_product_change_daily
    columns: [change_date, scope, change_group, opened_by_seed, n_products, n_periods, unseen_edits]
    text_columns: []
    count_columns: [n_products, n_periods]
    order_by: [change_date, scope, change_group, opened_by_seed]
  pipeline_health:
    # Operating facts about the pipeline itself (Phase B item 9), written daily by the `packsense-health` job; not a gold model, so the spec names its schema.
    # Job runs and durations and whether each outside service answered. No billing, no quota figure, no product data. Ninety days are shown.
    schema: workspace.packsense_health
    table: health_metric_daily
    where: "metric_date >= date_sub(current_date(), 90)"
    columns: [metric_date, subject, metric, value, unit, detail]
    text_columns: [subject, detail]
    count_columns: []
    order_by: [metric_date, subject, metric]

# The product cards behind the barcode lookup (roadmap Phase B item 12; gold mart_product_card): one small file per barcode prefix, fetched by the browser.
# Derived facts only: no product text, no image, no contributor data; every value is an enumerated code or a small count or a time (the licence gate checks the
# rendered files against its own copy of these domains). Not a `datasets` entry: the rows are product-grain, so they get their own builder and their own gate rules.
#   Shards: the first 3 digits of the barcode name the file; any file larger than split_above_bytes is split by one more digit, repeatedly (to 6 digits at most);
#   cards/splits.json lists the prefixes that were split. The lookup rule (licence_gate.shard_for) is: take 3 digits; while the prefix is in the list, take one more.
#   Only barcodes of 8 to 14 digits are published (the rest are not barcodes); the number dropped is reported.
card_shards:
  table: mart_product_card
  columns: [code, existence_status, light, things_flagged, off_error, off_bug, off_warning, off_info, rules_checkable, rules_failed,
            fields_filled, versions_kept, last_edit_t, first_version_edited_t, first_period_from_seed, in_india]
  split_above_bytes: 150000
