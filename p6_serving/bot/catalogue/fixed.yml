# Shared texts. An answer of the form "@name" in another file means: use the text under `texts.name` here.
# Repository link: the only link to the project's creator (owner's decision, 2026-10-24).
texts:
  closing_line: "This site describes what PackSense does today. It doesn't say what comes later."
  owner_line: "This assistant can only answer questions about the data and how this site works. PackSense is open source, and its code is public: https://github.com/Aayush8392/Packsense"
  code_line: "Yes. PackSense is open source. The code, and the tools it uses, are listed in the public repository: https://github.com/Aayush8392/Packsense"
  storage_line: "PackSense keeps its data with ordinary cloud storage services, and the pages on this site are public files. The code is open source: https://github.com/Aayush8392/Packsense"
  advice_refusal: "PackSense can't tell you whether a food is safe or healthy for you. The data comes from volunteers and can be wrong or out of date. For anything that matters to your health, check the pack itself and ask a doctor or dietitian."
  medical_refusal: "PackSense can't give medical or diet advice. If you feel unwell after eating something, please contact a doctor or your local emergency services. This site only describes a copy of food data."
  choice_reply: "This could mean more than one thing. Which one did you mean?"
  generic_reply: "I can't answer that. These are the three closest questions I can answer:"
  english_only: "This assistant understands English only. Please ask your question in English."
  barcode_route: "That looks like a barcode, so here is the lookup for it."
  barcode_invalid: "That doesn't look like a valid barcode. Barcodes have 8 to 14 digits."
  api_reply: "PackSense publishes files, not a live API. The India data can be downloaded as a spreadsheet file each month."
  law_reply: "PackSense replaces the usernames of the people who edit products with scrambled codes that never leave the private side, and removes emails, web addresses and similar details from product text. It does not claim to follow any particular privacy law. Scrambled names can still count as personal data, so no legal claim is made either way."
  tracking_reply: "PackSense does not run analytics and does not keep what you type. The site is hosted by GitHub, which records visitors' IP addresses for security, as its documentation says. PackSense sets no cookies of its own. A barcode lookup asks the host for one small file named after the first 3 to 6 digits of the code. So the host's logs could show those digits, but not the whole barcode."
  ai_honesty: "This assistant does not make up replies. It answers from a set of prepared answers about PackSense, and picks the one that is closest to your question."
  ai_model: "A language model. It only describes the data and gives no advice."
  correct_reply: "PackSense can't say whether a number is true. The data is written by volunteers and can be wrong or out of date. PackSense checks whether an entry agrees with itself and with Open Food Facts' own rules, and it uses the words \"flagged\" and \"consistent\", never \"correct\"."
  licence_plain: "The data is under the Open Database License (ODbL). In plain words, you can use it, share it and build on it, even for money. You must credit Open Food Facts. If you share a changed version of the database, you must keep it under the same licence. The individual entries are under a separate licence, the Database Contents License. Full text: https://opendatacommons.org/licenses/odbl/1-0/"
  credit_line: "Say that your work contains data from Open Food Facts, available under the Open Database License, and link to openfoodfacts.org and to the licence."
input_rules:
  max_characters: 300
  blank_or_spaces_only: "The send button stays off until something other than spaces is typed."
  over_limit: "The box stops at 300 characters and shows a counter."
# One reply per decline group (see the review doc, section 5). Every unmatched question gets generic_reply plus the three closest answerable questions.
decline_groups:
  Advice: "@advice_refusal"
  Health: "@advice_refusal"
  Medical: "@medical_refusal"
  NotEnglish: "@english_only"
  Barcode: "@barcode_route"
  Trust: "@correct_reply"
  ProductFacts: "The product card holds no nutrition values, ingredients or diet details. For those, check the pack or the product's page on Open Food Facts, which the card links to."
  Shops: "PackSense doesn't hold prices or where products are sold."
  NameSearch: "The lookup works with a barcode number, not a name. Type the number printed under the barcode."
  Ranking: "PackSense doesn't publish product rankings or comparisons. The Brands page shows how complete each brand's entries are, which is not the same as which brand is best."
  OFFHowTo: "That is done on Open Food Facts, not on PackSense. PackSense is a separate project, and Open Food Facts doesn't run it."
  Technical: "@code_line"
  Project: "@owner_line"
  Time: "PackSense can't predict the future. The charts show whole days since 30 September 2026, and the India page shows the latest day."
  Meta: "@generic_reply"
  Private: "PackSense never shows who edited a product and does not publish personal details."
  Food: "@generic_reply"
  NearMiss:
    17.44: "The site shows no ingredient text, because PackSense publishes facts it works out from the data and not product text."
    17.45: "The Nutri-Score is not shown on the card."
    17.49: "Who makes a product is not shown on the card."
    17.50: "Product rankings are not published."
    17.51: "Lists of allergen changes are not published."
    17.52: "Per-brand error counts are never published, because mistakes are often made by volunteers, not by the brand."
    default: "@decline_groups.ProductFacts"
