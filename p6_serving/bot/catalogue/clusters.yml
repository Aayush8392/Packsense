# Answer clusters. Entries that answer the same reading of a question closely enough that either would satisfy the visitor.
# When the two closest entries for a question share a cluster, that is not a real tie: the matcher answers with the closer one instead of asking "did you mean".
# Rules for membership (written 2026-11-01 from the seven older labelled question sets only, never from the 2026-11 calibration or test questions):
#   1. the labellers accepted the two entries TOGETHER for at least three questions, and for at least a third of the questions that accepted the rarer one;
#   2. the answers were read: they overlap and a visitor would be satisfied by either, not merely share a topic. Complementary answers (for example the
#      counts of changed products and of new products, which give different numbers) were left out;
#   3. a family (families.yml) keeps priority: two entries of one family still give the hub, so only links ACROSS families matter here;
#   4. an entry may sit in more than one cluster (round 2 widened the first 23 clusters this way); no deferred (unwritten) AI answers.
