# gitleaks configuration (the security workflow's gitleaks job reads this file from the repo root).
# Start from gitleaks' default rules; everything below is an exception to them.
[extend]
useDefault = true

# p4_modelling/fixtures/golden.json holds one md5 hash per row of each gold model, keyed by "<model>|<row key>" where the row key is a public
# Open Food Facts tag or product name. The generic-api-key rule reads a key followed by a 32-character high-entropy value as a credential
# (entropy 3.5 on `"categories|<product category>": "<md5>"`). It is a false positive on public data and a derived hash, not a secret.
# Scoped to this one rule and this one file: a real secret anywhere else, or any other rule matching here, still fails the scan.
[[allowlists]]
description = "md5 row hashes of the DuckDB comparison golden file"
targetRules = ["generic-api-key"]
paths = ['''p4_modelling/fixtures/golden\.json''']

# The same false positive in two more shapes (found 2026-11-04, when the weekly scan, which reads the whole history, reported 40 findings; every one was checked by hand).
# 1) p6_serving/showcase/showcase.json carries surrogate keys (`"history_key": "<md5>"`, `"brand_key": "<md5>"`): hashes derived from public Open Food Facts values, as in the
#    golden file. The entry matches only a WHOLE LINE that is a `*_key` name and a 32-character hex value, so a secret of any other shape still fails, in any file.
# 2) one line of p4_modelling/models/portable/dim_brand_canonical.sql, `when k.key_r2 = c.canonical_key_r2 then 'key'`: SQL identifiers that the rule reads as a key assignment.
[[allowlists]]
description = "derived md5 surrogate keys written as a whole JSON line"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*"[a-z_]+_key":\s*"[0-9a-f]{32}",?\s*$''']

[[allowlists]]
description = "SQL identifiers in the brand canonical model"
targetRules = ["generic-api-key"]
paths = ['''p4_modelling/models/portable/dim_brand_canonical\.sql''']
regexTarget = "line"
regexes = ['''when k\.key_r2 = c\.canonical_key_r2 then''']

# The freeze record of the nightly job (p8_steward/nightly/freeze.json, added 2026-11-13) holds one sha256 per method file, keyed by the file's path. Two of those paths contain the word
# 'key' (answer_key_lib.py, history_key_scan_check.py), and the generic-api-key rule reads `<name containing key>": "<64 hex characters>"` as a credential (entropy 3.66 and 3.81, the rule
# flags 3.5 and above). They are derived hashes of public source files, not secrets. Both conditions must hold (condition = "AND"): the file AND a whole line that is a quoted p8_steward/ path
# followed by a 64-character hex value, so a real secret of any other shape, or in any other file, still fails the scan, and so does any other rule matching in this file.
[[allowlists]]
description = "sha256 hashes of method files in the nightly freeze record"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''p8_steward/nightly/freeze\.json''']
regexTarget = "line"
regexes = ['''^\s*"p8_steward/[A-Za-z0-9_./-]+":\s*"[0-9a-f]{64}",?\s*$''']
