# Silver data contract v4: the guest list for workspace.packsense_silver.silver_product_versions
#
# v4 (2026-10-17) adds TEN columns (71 -> 81), chosen in the pre-gold review of silver; no logic changed, only the guest list. Rule used:
# a field belongs in silver when gold cannot derive it from silver and it carries no free text (everything derivable stays in gold).
# Measured on all of bronze (128,598 rows) before adding; shape = the tag rule below:
#   checked (0.4% of versions, value 'on'), last_checked_t (same rows)      community-verified marker for triage
#   additives_tags (38% present, 99.998% pass the shape), ingredients_analysis_tags (40%, 100%), nutrient_levels_tags (99%, 100%),
#   food_groups_tags (99%, 100%), packaging_tags (14%, 99.2%), origins_tags (28% present, 7% non-empty, 86.5%: the failures are free
#   text with spaces and are dropped by the rule), product_quantity_unit (41%), environmental_score_grade (95%).
# Considered and left out: ingredients_tags (89.6% pass, 432 contact-shaped survivors in 261 products, 20.4M raw characters),
# manufacturing_places_tags (10.7% of populated products have a 3+ digit run; none of its values pass the tag shape),
# brands_tags and image counts (decision 2026-10-17), ecoscore_grade (3.7% of versions; the old name of environmental_score_grade).
# Existing rows keep silver_contract_version 3 until the rebuild; a rebuild from bronze rewrites every row under v4 (it also maps the
# 2 old-format delta rows that v3 left as 'none').
#
# v3 (2026-10-15) adds ONE thing: the legacy-nutriments mapper (section legacy_nutriments below), needed for the India seed from the
# full dump. Measured on the dump's 24,795 India products: 6,099 carry the new `nutrition` object, 5,862 carry only the old
# `nutriments` object (4,959 of them with at least one core nutrient, the rest only OFF's computed keys), 12,834 carry neither.
# No column was added or removed (still 71), so no table migration; `nutrition_format` gains the value 'legacy'. Rows silver wrote
# under v2 keep silver_contract_version 2 (about 2 in 25,000 delta rows are old-format and stay 'none'; not reprocessed, by decision).
#
# WHAT CHANGED FROM v1 AND WHY (2026-10-15, after the full-data run and two external reviews, reviews/01_*):
# v1 tried to guarantee "no contributor name appears in silver text" with a global name-matching gate that quarantined rows.
# On all 91,917 real rows it quarantined 3.15% (ordinary words are also usernames: 12 words such as chocolat and carrefour
# covered 3,131 rows) while still missing others. Detection of names in free text cannot be exact, so v2 stops depending on it:
#   1. SHRINK the free text. Columns that can be validated exactly (a number and a unit, a well-formed tag, a fingerprint) replace
#      columns that had to be judged. Only product_name and brands remain as free text.
#   2. TRANSFORM, never block: patterns with a clear shape are scrubbed; the record's OWN contributor names are replaced;
#      rows are quarantined only when they cannot be loaded.
#   3. KEEP the scrambled contributor codes inside silver (egress: never). OFF publishes the usernames, so anyone can match a code
#      to a name by joining on (code, last_modified_t); the codes protect us from our own readers, not from the world.
#   4. PUT the strict check at the exit: one shared function (see the egress section) that every export path calls.
#   5. MEASURE what remains and say so. Measured on all of bronze: patterns of the contact kind are in 5 of 91,917 rows of
#      product_name+brands (1,396 hit-rows sit in ingredients_text, which is why that column is no longer kept); known
#      contributor names of 8+ characters that are not ordinary words: 161 rows; own names 8+: 4 rows.
#
# Silver keeps only what is listed here. Every other field in a bronze record is dropped (allowlist, not blocklist),
# so a field OFF adds tomorrow cannot reach silver until someone adds it to this file.
# Adding a field: see the drift monitor alert -> look at real values -> classify (public / hashed / unknown) ->
# edit this file in a pull request -> measure the field on all of bronze (patterns, names) -> merge -> backfill from bronze.
# Any threshold or rule derived from a sample must be re-measured on the full bronze before it is switched on.

contract: silver_product_versions
version: 4
table: workspace.packsense_silver.silver_product_versions
quarantine_table: workspace.packsense_silver.silver_quarantine
manifest_table: workspace.packsense_silver.silver_manifest
stats_table: workspace.packsense_silver.silver_run_stats
field_log_table: workspace.packsense_silver.silver_field_log   # per run: every top-level field OFF sent and in how many products (feeds the drift monitor)
source_table: workspace.packsense_bronze.bronze_delta_raw
grain: [code, last_modified_t]        # one row per product version; history is kept for the gold SCD2 table

# ---------------------------------------------------------------------------------------------------------------
# Contributor identities
# ---------------------------------------------------------------------------------------------------------------
hmac:
  secret_scope: packsense
  secret_key: hmac_key_v1
  key_version: 1                      # stored on every row, so a future re-key is visible
  algorithm: HMAC-SHA256              # output: 64 hex characters
  normalise: [nfkc, lowercase, strip] # applied before hashing
  # No escrow copy of the key, by decision: bronze and the archive keep the raw names, so a lost key means re-key and
  # re-run silver (every contributor then gets a new code). Runbook to be written and drilled once.

# Raw fields whose values are contributor identities. All of them are hashed (the ones silver keeps a column for) and all of
# them feed the list of the record's OWN names used by own-handle redaction. Verified on real data: last_modified_by equals
# last_editor on every row where it is set (24,547 of 24,547), so it has no column of its own; owner values all start
# with "org-" (organisation accounts, hashed anyway). All 75,749 names in bronze use only letters, digits, '_', '.' and '-'
# (0 outside that alphabet, 0 non-Latin), so whole-word matching on that alphabet is complete for names.
personal_source_fields:
  - creator
  - last_editor
  - last_modified_by
  - last_checker
  - editors_tags
  - informers_tags
  - checkers_tags
  - correctors_tags
  - photographers_tags
  - weighers_tags
  - editors            # legacy list fields, present in ~3% of rows; not kept
  - informers
  - checkers
  - correctors
  - photographers
  - owner
  - owner_imported
  - owners_tags

# ---------------------------------------------------------------------------------------------------------------
# Own-handle redaction: the one place a contributor name is acted on inside the pipeline. It needs nothing but the record
# itself (stateless): the record's own contributors come from its own personal_source_fields.
# ---------------------------------------------------------------------------------------------------------------
own_handle_redaction:
  min_length: 8                       # whole-word, case-insensitive; shorter names are too often ordinary words
  sentinel: "‹user›"       # a character pair that does not occur in product text; a CI test counts sentinels against substitutions
  columns: [product_name]
  # brands is deliberately NOT listed: producer and brand accounts edit their own brand (156 own-name hits in brands over all
  # of bronze, e.g. carrefour, barilla, ferrero, all legitimate branding). Measured own-name hits of 8+ characters elsewhere:
  # product_name 2, ingredients_text 2 (4 rows in 91,917).

# ---------------------------------------------------------------------------------------------------------------
# Scrub: patterns with a clear shape, removed from the free-text columns marked scrub: true (product_name, brands).
# Field-aware on purpose: a pattern run over every field gave 828 false Aadhaar hits on packaging codes.
# ---------------------------------------------------------------------------------------------------------------
scrub:
  email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
  aadhaar: '(?<!\d)[2-9]\d{3}[ -]\d{4}[ -]\d{4}(?!\d)'
  pan: '(?<![A-Z0-9])[A-Z]{5}\d{4}[A-Z](?![A-Z0-9])'
  gstin: '\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b'          # contains a PAN, which the pan pattern misses (digit before it)
  url: '(?:https?://|www\.)\S+'
  social_link: '(?:facebook\.com|instagram\.com|twitter\.com|x\.com|t\.me|wa\.me|tiktok\.com|youtu\.be|youtube\.com|linkedin\.com)/\S+'
  at_handle: '(?<![\w.@])@[A-Za-z0-9_.]{3,}'
  obfuscated_email: '\b[\w.\-]+\s*(?:\(at\)|\[at\]|\{at\}|\sat\s|\sarobase\s)\s*[\w\-]+\s*(?:\(dot\)|\[dot\]|\{dot\}|\sdot\s|\spoint\s)\s*\w{2,}'
  replacement: '[removed]'
  # Phone numbers are NOT scrubbed by pattern: a liberal pattern also matches dates (14.10.2026) and lot codes and would
  # silently delete them. The fields that carry phone numbers (emb_codes*, customer_service*, producer*) are not kept.
  # Measured over all 91,917 rows (hit-rows per class): in ingredients_text 1,396, in product_name+brands 5.

# ---------------------------------------------------------------------------------------------------------------
# Shape checks: exact validation of values that must come from a small closed vocabulary. A value that fails becomes
# NULL (a tag or map entry is dropped) and is counted per column in the run stats; it never quarantines the row.
# ---------------------------------------------------------------------------------------------------------------
shape:
  tag: '^[a-z]{2,3}:[\w.%-]+$'                      # language prefix, then letters/digits/hyphen/dot/percent: no spaces, brackets, backslashes
  nutrient_key: '^[a-z0-9]+(?:-[a-z0-9]+)*$'        # 129 distinct keys in bronze today, all of this shape
  enum: '^[a-z0-9%/._-]{1,20}$'                     # input_sets source / per / per_unit / preparation: 3, 6, 6 and 2 distinct values today
  unit: '^[\w% ./µ-]{0,12}$'                   # nutrient unit strings (g, mg, kJ, kcal, %, % vol, ...)
  modifier: '^(?:~|<|>|≤|≥)?$'
  # Tags that fail the tag shape (e.g. "fr:Autres produits", "de:Milch und Milchderivate", junk such as
  # "fr:\ origin\ :[\ France\ ]}") are dropped from silver; bronze still has them. 3% to 8% of tag occurrences are dropped.

# ---------------------------------------------------------------------------------------------------------------
# Parsing: free text that is really a number and a unit becomes two columns; anything that does not parse becomes NULL.
# Measured on all of bronze (scratch run of contract v2, 2026-10-15): 36,811 of 41,329 non-empty quantity values (89.1%) and
# 41,105 of 43,313 non-empty serving_size values (94.9%) parse; the rest become NULL (bare numbers, a bare 'kg', free words).
# ---------------------------------------------------------------------------------------------------------------
parsing:
  units:
    kg: kg
    g: g
    gr: g
    mg: mg
    l: l
    cl: cl
    ml: ml
    dl: dl
    oz: oz
    lb: lb
    lbs: lb
    "fl oz": fl_oz
    "г": g          # Cyrillic g
    "гр": g
    "мл": ml
    "л": l
    "γρ": g    # Greek gr
  # quantity: [count x] amount unit   ("6 x 33 cl" -> multiplier 6, amount 33, unit cl). serving_size: the first amount in g or ml
  # anywhere in the value ("1 cup (240 ml)" -> 240 ml); descriptive words are discarded.

# ---------------------------------------------------------------------------------------------------------------
# Ingredients fingerprint: ingredients_text is NOT kept (it holds 99.6% of the contact-shaped hits: 64 emails, 872 URLs,
# 253 phone-like numbers, 165 contact phrases over all of bronze). A change alert needs only to know that the text changed.
# The fingerprint is not secret and does not need to be: it stops us carrying and republishing the text.
# ---------------------------------------------------------------------------------------------------------------
fingerprint:
  normalise: [nfkc, lowercase, collapse_whitespace, strip]
  algorithm: SHA-256

# ---------------------------------------------------------------------------------------------------------------
# Quarantine: only records that cannot be loaded. Implausible VALUES (62 g sugar in a biscuit) are not quarantined:
# they are the signal the triage work looks for. Content suspicion is never a reason to quarantine.
# ---------------------------------------------------------------------------------------------------------------
quarantine_codes:
  Q_BAD_JSON: raw_json is not valid JSON
  Q_NOT_OBJECT: raw_json is valid JSON but not an object
  Q_BAD_CODE: code missing, empty or not all digits (2 real cases in bronze today, both the empty string)
  Q_BAD_LAST_MODIFIED: last_modified_t missing or not an integer
  Q_TRANSFORM_ERROR: unexpected failure while building the row (our bug or a shape nobody foresaw); counted, and the job goes red
# The quarantine payload is the record restricted to the fields in this contract, identities hashed, patterns scrubbed. The
# quarantine table is readable by the pipeline only (analysts see counts). The run guard stays permanently: a quarantine
# rate above 1% fails the run.

# ---------------------------------------------------------------------------------------------------------------
# Egress: every place data leaves our control goes through one shared function (silver_lib/egress.py) that
#   1. drops every column marked egress: never (the hashed identities, never even as codes),
#   2. applies the scrub patterns to all text,
#   3. replaces known contributor names of 8+ characters as whole words, EXCEPT names that appear in 10 or more products'
#      text (ordinary words and brands such as chocolat, carrefour: 12 such names covered 3,131 rows) and names that are
#      the product's own owner account in brands; the list of names is derived from bronze at export time, never stored,
#   4. refuses the export if a scan afterwards still finds a pattern or a replaced name.
# Measured size of step 3 over all of bronze: 161 rows (0.175%). Names of 5 to 7 characters are counted, not replaced
# (530 rows, 386 in product_name or brands; the 8+ equivalents read as brand and business words).
# Exits (the inventory; a test fails if an export path does not call the function): monthly India release, public site pages,
# static score files, LLM prompts (steward agent, system and tool output), shared ML feature tables, logs, README, test fixtures.
# ---------------------------------------------------------------------------------------------------------------
egress:
  handle_min_length: 8
  ordinary_word_min_products: 10
  refuse_on_residue: true

# ---------------------------------------------------------------------------------------------------------------
# Legacy nutriments (OFF's old nutrition format, `$.nutriments`), mapped into the same columns as the new format.
# Only when a record has NO `nutrition.aggregated_set` (the new format wins if both exist; both never occurred among India products).
#   * Only the keys `<nutrient>_100g` are read. OFF has already normalised them to per 100 g (or 100 ml), also when the user entered
#     the values per serving (1,486 India products), so `nutrition_data_per` is not needed. `_unit`, `_value`, `_serving`, `_label`,
#     `_computed` and `_prepared_100g` keys are ignored: `_unit` is the unit the user typed (energy_unit can say kcal while
#     energy_100g is in kJ), and the prepared values are a different basis.
#   * The unit is fixed per key and equals the unit the new format records for that key in all of silver today (checked on 91,915
#     rows: every nutrient is in g except energy kJ/kcal, alcohol '% vol', and crude-ash, cocoa and collagen-meat-protein-ratio '%').
#   * allowed_keys = every nutrient key seen in the new-format `nutrients` maps in silver, minus OFF's computed non-nutrients
#     (nova-group, fruits-vegetables-*, ph, glycemic-index, water-hardness, whole-grain, acidity, carbon-footprint and four
#     language-prefixed junk keys). A product whose only `_100g` keys are computed ones is NOT 'legacy': it stays 'none'.
#   * Value that is not a finite number: the entry is skipped and counted (coerce_failures['legacy_nutriments.value']).
#   * nutrition_per is NULL for legacy (the old format does not record g versus ml), nutrition_preparation is 'as_sold',
#     input_sets is NULL (no per-source information; the source-disagreement detector excludes legacy rows via nutrition_format).
# ---------------------------------------------------------------------------------------------------------------
legacy_nutriments:
  suffix: _100g
  modifier_suffix: _modifier           # an old-format modifier, if a record has one (none seen in 5,862 India products)
  default_unit: g
  units:
    energy: kJ
    energy-kj: kJ
    energy-kcal: kcal
    alcohol: "% vol"
    crude-ash: "%"
    cocoa: "%"
    collagen-meat-protein-ratio: "%"
  allowed_keys:
    - energy
    - energy-kcal
    - energy-kj
    - proteins
    - fat
    - carbohydrates
    - carbohydrates-total
    - salt
    - sodium
    - sugars
    - saturated-fat
    - trans-fat
    - monounsaturated-fat
    - polyunsaturated-fat
    - unsaturated-fat
    - omega-3-fat
    - omega-6-fat
    - omega-9-fat
    - fiber
    - soluble-fiber
    - insoluble-fiber
    - added-sugars
    - starch
    - polyols
    - lactose
    - glucose
    - fructose
    - sucrose
    - maltose
    - galactose
    - maltodextrins
    - erythritol
    - psicose
    - cholesterol
    - calcium
    - iron
    - potassium
    - magnesium
    - zinc
    - phosphorus
    - manganese
    - copper
    - selenium
    - iodine
    - chloride
    - fluoride
    - chromium
    - molybdenum
    - silica
    - bicarbonate
    - sulphate
    - sulfates
    - nitrate
    - nitrates
    - nitrite
    - vitamin-a
    - vitamin-d
    - vitamin-c
    - vitamin-e
    - vitamin-k
    - vitamin-b1
    - vitamin-b2
    - vitamin-b6
    - vitamin-b9
    - vitamin-b12
    - vitamin-pp
    - pantothenic-acid
    - biotin
    - folates
    - phylloquinone
    - beta-carotene
    - choline
    - taurine
    - caffeine
    - carnitine
    - creatine
    - inositol
    - alcohol
    - cocoa
    - water
    - crude-ash
    - dry-residue
    - casein
    - serum-proteins
    - collagen-meat-protein-ratio
    - beta-glucan
    - gamma-oryzanol
    - added-salt
    - energy-from-fat
    - butyric-acid
    - caproic-acid
    - caprylic-acid
    - capric-acid
    - lauric-acid
    - myristic-acid
    - palmitic-acid
    - stearic-acid
    - arachidic-acid
    - behenic-acid
    - montanic-acid
    - oleic-acid
