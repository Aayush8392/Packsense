# PackSense pipeline-health bundle (Phase B item 9: the capacity panel and dependency health).
#
# Deployed BY THE ADMIN from the laptop (like the publish and policy bundles: there is no Databricks admin credential in CI, by decision): from this
# folder, `databricks bundle deploy` / `bundle run health_collect`. The job is owned by the admin and runs with the admin's rights (no run_as): Free Edition lets nobody
# grant the system tables to another principal (GRANT on the `system` catalog needs MANAGE, which not even the admin holds; measured 2026-10-21). It reads two system
# tables and the outside services, and writes one table in its own schema; it reads no product data.
bundle:
  name: packsense-health

include:
  - resources/*.yml

sync:
  paths:
    - ..                   # p9_operations itself (the bundle root is p9_operations/health): health_lib.py, egress_lib.py and the notebooks
  exclude:
    - "**/tests/**"
    - "**/bootstrap/**"
    - "**/README.md"
    - "**/airflow/**"
    - "**/fixtures/**"

variables:
  health_cron:
    description: quartz cron (UTC); 08:40 is after the 08:15 gold build and before the 09:00 publish, so the site shows the same morning's health
    default: "0 40 8 * * ?"
  health_pause:
    description: PAUSED until the dry run and the first real run have passed by hand; the first real run is followed by a commit that sets this to UNPAUSED
    default: PAUSED
  ping:
    description: whether the notebook pings healthchecks.io ("true" or "false")
    default: "true"

targets:
  prod:
    default: true

