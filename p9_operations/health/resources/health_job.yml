# The job `packsense-health`: daily, after the gold build and before the publish, write the pipeline-health rows (p9_operations/notebooks/health_collect.py).
# Not retried automatically: the merge is idempotent but a retry would only repeat the outside requests of a failed service check.
resources:
  jobs:
    health_collect:
      name: packsense-health
      max_concurrent_runs: 1
      timeout_seconds: 1200
      schedule:
        quartz_cron_expression: ${var.health_cron}
        timezone_id: UTC
        pause_status: ${var.health_pause}
      # No run_as: the job is owned by the admin who deploys it (like packsense-policy). A non-admin principal cannot be granted the system tables on Free Edition
      # (GRANT on `system` needs MANAGE, which not even the admin holds; measured 2026-10-21), so the collector runs with the admin's rights. Its code is small, reads
      # two system tables and the outside services, writes one table, and reaches production only when the admin deploys it from the laptop.
      tasks:
        - task_key: collect
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../../notebooks/health_collect.py
            base_parameters:
              run_id: "{{job.run_id}}"
              ping_healthchecks: ${var.ping}
