# The job `packsense-bronze-load` (it replaced the old create_bronze_job.py script): capture, then bronze, then silver, then drift, plus the
# taxonomy load (added 2026-10-17, after silver so a /fail ping from it is the last word on the core check).
# 2026-10-18 (decision O1 + T2 + G1 after external review 02): the capture is the FIRST task and the job starts at 06:45 UTC, so each day's
# file is loaded the day it is published instead of a day later. The GitHub capture stays as the independent second path.
# bronze, silver, drift and taxonomy run even if the task before them failed (run_if ALL_DONE): a failed capture never blocks loading files
# that already landed; silver is told how bronze ended.
resources:
  jobs:
    bronze_load:
      name: packsense-bronze-load
      max_concurrent_runs: 1
      timeout_seconds: 7200   # capture may poll OFF for up to an hour (06:45 to 07:45 UTC), then the load takes 5 to 15 minutes
      schedule:
        quartz_cron_expression: "0 45 6 * * ?"   # 06:45 UTC = 12:15 IST (OFF publishes 06:19 to 06:33 UTC)
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: capture
          # A failure must stay visible: no automatic retry (the GitHub capture is the second chance, and a retry that succeeds would
          # turn the capture check green and hide the failure, as seen with drift on 2026-10-16).
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../../p1_intake/notebooks/capture_task.py
            base_parameters:
              run_id: "{{job.run_id}}"
              landing: ${var.landing}
              secret_scope: ${var.secret_scope}
              upload_to_b2: ${var.capture_b2}
              ping_healthchecks: ${var.ping}
        - task_key: bronze
          depends_on:
            - task_key: capture
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/bronze_load.py
            base_parameters:
              run_id: "{{job.run_id}}"
              landing: ${var.landing}
              bronze_schema: ${var.bronze_schema}
        - task_key: silver
          depends_on:
            - task_key: bronze
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/silver_load.py
            base_parameters:
              run_id: "{{job.run_id}}"
              bronze_result: "{{tasks.bronze.result_state}}"
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              ping_healthchecks: ${var.ping}
        - task_key: drift
          depends_on:
            - task_key: silver
          run_if: ALL_DONE
          # An ALERT makes the notebook raise on purpose (the check stays red, the load is untouched). Serverless retries a
          # failed task by itself; the retry finds the day already judged, pings OK and turns the check green within a minute,
          # which hides the alert (seen 2026-10-16). So no automatic retry for this task.
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/drift_check.py
            base_parameters:
              run_id: "{{job.run_id}}"
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              ping_healthchecks: ${var.ping}
        - task_key: taxonomy
          depends_on:
            - task_key: silver
          run_if: ALL_DONE
          # Loads OFF's taxonomy snapshots from landing into silver_taxonomy_tag. Sends only a /fail ping (to the core check); the
          # success signal for that check is silver's own ping, which has already come.
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/taxonomy_load.py
            base_parameters:
              run_id: "{{job.run_id}}"
              landing: ${var.landing}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              ping_healthchecks: ${var.ping}
