# Same job as p2_lakehouse/bootstrap/create_bronze_job.py (job `packsense-bronze-load`): bronze, then silver, then drift, plus the taxonomy
# load (added 2026-10-17, after silver so a /fail ping from it is the last word on the core check).
# silver, drift and taxonomy run even if the task before them failed (run_if ALL_DONE); silver is told how bronze ended.
resources:
  jobs:
    bronze_load:
      name: packsense-bronze-load
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"   # 09:00 UTC = 14:30 IST
        timezone_id: UTC
        pause_status: UNPAUSED
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/bronze_load.py
            base_parameters:
              run_id: "{{job.run_id}}"
              landing: ${var.landing}
              bronze_schema: ${var.bronze_schema}
        - task_key: silver
          depends_on:
            - task_key: bronze
          run_if: ALL_DONE
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/silver_load.py
            base_parameters:
              run_id: "{{job.run_id}}"
              bronze_result: "{{tasks.bronze.result_state}}"
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              ping_healthchecks: ${var.ping}
        - task_key: drift
          depends_on:
            - task_key: silver
          run_if: ALL_DONE
          # An ALERT makes the notebook raise on purpose (the check stays red, the load is untouched). Serverless retries a
          # failed task by itself; the retry finds the day already judged, pings OK and turns the check green within a minute,
          # which hides the alert (seen 2026-10-16). So no automatic retry for this task.
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/drift_check.py
            base_parameters:
              run_id: "{{job.run_id}}"
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              ping_healthchecks: ${var.ping}
        - task_key: taxonomy
          depends_on:
            - task_key: silver
          run_if: ALL_DONE
          # Loads OFF's taxonomy snapshots from landing into silver_taxonomy_tag. Sends only a /fail ping (to the core check); the
          # success signal for that check is silver's own ping, which has already come.
          notebook_task:
            notebook_path: ../../p2_lakehouse/notebooks/taxonomy_load.py
            base_parameters:
              run_id: "{{job.run_id}}"
              landing: ${var.landing}
              silver_schema: ${var.silver_schema}
              secret_scope: ${var.secret_scope}
              ping_healthchecks: ${var.ping}
