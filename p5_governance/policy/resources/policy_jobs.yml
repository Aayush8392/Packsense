# Four jobs that run AS a service principal (policy_check.py tests that principal), and the admin-owned job that starts them.
resources:
  jobs:
    policy_gold:
      name: packsense-policy-gold
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: pol_env
          spec:
            environment_version: "2"
            dependencies:
              - PyYAML==6.0.3
      run_as: {service_principal_name: "520fb1ac-a6cf-4913-b7af-c081eb32456c"}
      tasks:
        - task_key: check
          environment_key: pol_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/policy_check.py
            base_parameters: {identity: packsense-gold, expected_id: "520fb1ac-a6cf-4913-b7af-c081eb32456c"}
    policy_gold_dev:
      name: packsense-policy-gold-dev
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: pol_env
          spec:
            environment_version: "2"
            dependencies:
              - PyYAML==6.0.3
      run_as: {service_principal_name: "05620ebf-cd4d-4b0a-88ad-029915441965"}
      tasks:
        - task_key: check
          environment_key: pol_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/policy_check.py
            base_parameters: {identity: packsense-gold-dev, expected_id: "05620ebf-cd4d-4b0a-88ad-029915441965"}
    policy_deployer:
      name: packsense-policy-deployer
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: pol_env
          spec:
            environment_version: "2"
            dependencies:
              - PyYAML==6.0.3
      run_as: {service_principal_name: "4fdd8310-bedc-4a22-8a94-bf436118e3e5"}
      tasks:
        - task_key: check
          environment_key: pol_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/policy_check.py
            base_parameters: {identity: packsense-deployer, expected_id: "4fdd8310-bedc-4a22-8a94-bf436118e3e5"}
    policy_deployer_dev:
      name: packsense-policy-deployer-dev
      max_concurrent_runs: 1
      timeout_seconds: 900
      environments:
        - environment_key: pol_env
          spec:
            environment_version: "2"
            dependencies:
              - PyYAML==6.0.3
      run_as: {service_principal_name: "2e1246f9-63d0-4a91-91bb-e2b628348789"}
      tasks:
        - task_key: check
          environment_key: pol_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/policy_check.py
            base_parameters: {identity: packsense-deployer-dev, expected_id: "2e1246f9-63d0-4a91-91bb-e2b628348789"}

    # Owned by the admin who deploys it: it starts the four jobs above, tests the two users, checks grants drift, then reports.
    policy:
      name: packsense-policy
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: ${var.policy_cron}
        timezone_id: UTC
        pause_status: ${var.policy_pause}
      environments:
        - environment_key: sdk_env
          spec:
            environment_version: "2"
            dependencies:
              - databricks-sdk==0.151.0
              - PyYAML==6.0.3
      tasks:
        - task_key: run_gold
          run_job_task: {job_id: "${resources.jobs.policy_gold.id}"}
        - task_key: run_gold_dev
          run_job_task: {job_id: "${resources.jobs.policy_gold_dev.id}"}
        - task_key: run_deployer
          run_job_task: {job_id: "${resources.jobs.policy_deployer.id}"}
        - task_key: run_deployer_dev
          run_job_task: {job_id: "${resources.jobs.policy_deployer_dev.id}"}
        - task_key: pipeline_user
          environment_key: sdk_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/policy_check_user.py
            base_parameters: {identity: pipeline-user, token_key: pipeline_user_token}
        - task_key: analyst
          environment_key: sdk_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/policy_check_user.py
            base_parameters: {identity: analyst, token_key: analyst_token}
        - task_key: grants_drift
          environment_key: sdk_env
          disable_auto_optimization: true
          notebook_task:
            notebook_path: ../notebooks/grants_drift.py
        - task_key: report
          environment_key: sdk_env
          run_if: ALL_DONE
          depends_on:
            - {task_key: run_gold}
            - {task_key: run_gold_dev}
            - {task_key: run_deployer}
            - {task_key: run_deployer_dev}
            - {task_key: pipeline_user}
            - {task_key: analyst}
            - {task_key: grants_drift}
          notebook_task:
            notebook_path: ../notebooks/policy_report.py
            base_parameters:
              ping: ${var.ping}
              results: "run_gold={{tasks.run_gold.result_state}},run_gold_dev={{tasks.run_gold_dev.result_state}},run_deployer={{tasks.run_deployer.result_state}},run_deployer_dev={{tasks.run_deployer_dev.result_state}},pipeline_user={{tasks.pipeline_user.result_state}},analyst={{tasks.analyst.result_state}},grants_drift={{tasks.grants_drift.result_state}}"
