# PackSense Databricks Asset Bundle: the two scheduled jobs, deployed as a fixed copy of the code instead of
# running notebooks straight from `main`.
#
# dev  : scratch schemas, its own landing volume and secret scope, no schedules (each dev job is paused by name below: development mode alone
#        does not pause a job whose file says UNPAUSED), no pings.
#        Deployed by the dev principal, which has rights on dev objects only. The archive job is deployed there too but
#        cannot work (the dev scope holds no B2 or HF keys); do not run it.
# prod : the real schemas, landing volume and scope and the current schedules; deployed only by the prod principal.
#
# The identity that deploys also runs the jobs (Free Edition cannot bind a job to another identity), so each principal
# needs the grants listed in p3_delivery/README.md. Schemas and volumes are created beforehand by an admin.
bundle:
  name: packsense

include:
  - p3_delivery/resources/*.yml

# Only what the notebooks import or run. Tests, infra, docs and bootstrap scripts stay out of the deployed copy.
sync:
  exclude:
    - "**/tests/**"
    - "**/bootstrap/**"
    - infra/**
    - docs/**
    - reviews/**
    - .github/**

variables:
  bronze_schema:
    default: workspace.packsense_bronze
  silver_schema:
    default: workspace.packsense_silver
  landing:
    default: /Volumes/workspace/packsense/landing
  secret_scope:
    default: packsense
  snapshots_schema:
    description: where the weekly OFF snapshot flag events are kept (p9_operations/snapshot_lib.py)
    default: workspace.packsense_snapshots
  ping:
    description: whether the notebooks ping healthchecks.io ("true" or "false")
    default: "true"
  capture_b2:
    description: whether the capture task uploads to B2 ("true" in prod; "false" in dev, whose scope holds no B2 key)
    default: "true"

targets:
  dev:
    default: true
    mode: development
    variables:
      bronze_schema: workspace.packsense_dev_bronze
      silver_schema: workspace.packsense_dev_silver
      snapshots_schema: workspace.packsense_dev_snapshots
      landing: /Volumes/workspace/packsense_dev/landing   # its own volume: the dev principal has no rights on the real one
      secret_scope: packsense_dev                         # holds only a throwaway HMAC key: dev never sees the real secrets
      ping: "false"
      capture_b2: "false"
    resources:
      jobs:
        # Found 2026-10-20: an explicit `pause_status: UNPAUSED` in a job file overrides development mode, so every dev copy ran on its schedule
        # every day (dev bronze with a capture that back-filled all of OFF's files into the dev landing volume, dev gold, and a dev archive that failed
        # daily). Nothing reads dev's output and production does the real work, so dev pauses each schedule by name; a dev job is started by hand
        # when a change is tried there. The dev copy of the gold job is paused in p4_modelling/databricks.yml. A test keeps all four in step.
        bronze_load:
          schedule:
            pause_status: PAUSED
        archive:
          schedule:
            pause_status: PAUSED
        snapshots:
          schedule:
            pause_status: PAUSED
  prod:
    # No custom root_path: only the deploy principal deploys prod, so its own home folder (private to it) holds the files and
    # the state. /Workspace/Shared would be writable by every workspace user, and these notebooks read the HMAC key.
    default: false
